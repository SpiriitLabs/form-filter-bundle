name: "CI Tests"

on:
  pull_request:
  push:

env:
  fail-fast: true
  PHPUNIT_FLAGS: "-v"
  SYMFONY_DEPRECATIONS_HELPER: weak

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP v${{ matrix.php }}, Symfony v${{ matrix.symfony }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: 8.1, symfony: "6.4.*", composer-flags: '--prefer-dist' }
          - { php: 8.2, symfony: "7.4.*", composer-flags: '--prefer-dist' }
          - { php: 8.4, symfony: "8.1.*", composer-flags: '--prefer-dist' }
          - { php: 8.4, symfony: "8.2.*", composer-flags: '--prefer-dist' }

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl,mbstring,xdebug
          ini-values: date.timezone="Europe/Paris"
          coverage: xdebug
          tools: "composer:v2,flex"

      - name: "Show PHP version"
        run: php -v && composer -V

      - name: "Cache Composer packages"
        uses: "actions/cache@v6"
        with:
          path: "~/.composer/cache"
          key: "php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('composer.json') }}-flags-${{ matrix.composer-flags }}"
          restore-keys: "php-"

      - name: "Install dependencies"
        run: composer update ${{ matrix.composer-flags }} --prefer-dist
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"

      - name: "Run PHPUnit Tests"
        run: "composer test"
